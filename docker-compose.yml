name: xpass

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://xpass:${POSTGRES_PASSWORD:-xpass_dev}@postgres:5432/xpass
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    S3_ENDPOINT: http://storage:8333
    OIDC_JWKS_URL: ${OIDC_JWKS_URL_INTERNAL:-http://keycloak:8080/realms/xpass/protocol/openid-connect/certs}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: xpass
      POSTGRES_USER: xpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xpass_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpass -d xpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 8 /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage compatible S3 pour le développement (SeaweedFS ; les images MinIO
  # ne sont plus distribuées publiquement). Production : tout service S3.
  storage:
    image: chrislusf/seaweedfs:3.85
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
      - ./infra/storage/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Fournisseur d'identité OIDC de développement (realm importé : clients et comptes de test).
  # Production : votre propre instance Keycloak, en HTTPS, sans les comptes de démonstration.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only}
      KC_HOSTNAME: ${PREVIEW_AUTH_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # « Continuer avec Google » : lus par infra/keycloak/activer-google.sh (vides = bouton absent).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      # Comptes et sessions conservés entre deux redémarrages (le realm n'est importé qu'à la première création).
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/xpass-realm.json:/opt/keycloak/data/import/xpass-realm.json:ro
      - ./infra/keycloak/themes/xpass:/opt/keycloak/themes/xpass:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Serveur e-mail de test : capture tous les e-mails (interface http://localhost:8025), n'envoie rien.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./infra/seed-media/placeholders:/srv/seed-media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2

  scheduler:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  kafka-consumer:
    <<: *backend
    command: python -m app.workers.kafka_consumer

volumes:
  keycloak-data:
  pgdata:
  storagedata:
  kafkadata:
