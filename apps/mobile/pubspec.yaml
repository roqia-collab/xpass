name: xpass_mobile
description: Application mobile cliente XPASS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  crypto: ^3.0.6
  web: ^1.1.0
  flutter_web_auth_2: ^4.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# Icône : dart run flutter_launcher_icons — écran de démarrage : dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#FAF8F3"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#FAF8F3"
    theme_color: "#121A35"

flutter_native_splash:
  color: "#FAF8F3"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#FAF8F3"
    image: assets/brand/splash_logo.png
  web: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
