# XPASS — production sur un seul serveur (Docker). Voir docs/DEPLOIEMENT.md.
# Démarrage : docker compose -f infra/production/docker-compose.prod.yml --env-file infra/production/.env.production up -d
#
# Différences avec le développement :
# - HTTPS automatique (Caddy + Let's Encrypt) sur 4 sous-domaines ; aucun autre port exposé ;
# - Keycloak en mode production, sur PostgreSQL, sans comptes de démonstration ;
# - pas de Mailpit (vrai SMTP), pas de SeaweedFS (vrai stockage S3), pas de connexion de démonstration ;
# - sauvegarde quotidienne de la base, conservée 14 jours.
name: xpass-prod

x-backend: &backend
  build: ../../backend
  restart: unless-stopped
  env_file: .env.production
  environment:
    APP_ENV: production
    AUTH_DEV_LOGIN_ENABLED: "false"
    DATABASE_URL: postgresql+psycopg://xpass:${POSTGRES_PASSWORD}@postgres:5432/xpass
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OIDC_ISSUER: https://auth.${DOMAIN}/realms/xpass
    OIDC_JWKS_URL: http://keycloak:8080/realms/xpass/protocol/openid-connect/certs
    API_PUBLIC_URL: https://api.${DOMAIN}
    APP_PUBLIC_URL: https://app.${DOMAIN}
    PORTALS_PUBLIC_URL: https://pro.${DOMAIN}
    CORS_ORIGINS: https://app.${DOMAIN},https://admin.${DOMAIN},https://rh.${DOMAIN},https://pro.${DOMAIN}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../apps/mobile/build/web:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, portals, keycloak]

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpass
      POSTGRES_USER: xpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      - ./postgres-init/20-keycloak.sh:/docker-entrypoint-initdb.d/20-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpass -d xpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 8 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"          # TLS terminé par Caddy
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # « Continuer avec Google » : lus par infra/keycloak/activer-google.sh (vides = bouton absent).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      # Realm de production généré par make_realm.py (sans comptes, secrets propres, adresses HTTPS).
      - ./keycloak/xpass-realm.prod.json:/opt/keycloak/data/import/xpass-realm.json:ro
      - ../keycloak/themes/xpass:/opt/keycloak/themes/xpass:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*'"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=4

  scheduler:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO

  kafka-consumer:
    <<: *backend
    command: python -m app.workers.kafka_consumer

  portals:
    build:
      context: ../../apps/portals
      args:
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      XPASS_API_URL: http://api:8000
      PORTALS_PUBLIC_URL: https://pro.${DOMAIN}
      PORTALS_PUBLIC_URLS: https://pro.${DOMAIN},https://admin.${DOMAIN},https://rh.${DOMAIN}
      ADMIN_PUBLIC_URL: https://admin.${DOMAIN}
      RH_PUBLIC_URL: https://rh.${DOMAIN}
      APP_PUBLIC_URL: https://app.${DOMAIN}
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/xpass
      OIDC_PORTALS_CLIENT_ID: xpass-portals
      OIDC_PORTALS_CLIENT_SECRET: ${OIDC_PORTALS_CLIENT_SECRET}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      LEGAL_VALIDATED: ${LEGAL_VALIDATED:-false}
    depends_on: [api]

  # Sauvegarde quotidienne (pg_dump compressé) des bases xpass et keycloak, conservée 14 jours.
  # Copiez régulièrement le volume « backups » hors du serveur (voir docs/DEPLOIEMENT.md).
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: xpass
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  kafkadata:
  backups:
  caddy-data:
  caddy-config:
